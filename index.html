<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Step X | Under Maintenance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;
background:
radial-gradient(circle at top right,#39ff1420,transparent 30%),
radial-gradient(circle at bottom left,#00ff8815,transparent 35%),
#0b0b0d;

color:white;

display:flex;
justify-content:center;
align-items:center;

height:100vh;
overflow:hidden;

}

.glow{

position:absolute;

width:450px;
height:450px;

background:#39ff14;

filter:blur(180px);

opacity:.15;

border-radius:50%;

animation:pulse 6s infinite ease-in-out;

}

.card{

position:relative;

z-index:2;

text-align:center;

padding:60px;

max-width:700px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

box-shadow:0 30px 80px rgba(0,0,0,.45);

}

.logo{

font-size:60px;
font-weight:800;
letter-spacing:3px;

}

.logo span{

color:#39ff14;

}

.tag{

display:inline-block;

margin-top:20px;

padding:10px 22px;

background:#39ff1420;

border-radius:50px;

color:#39ff14;

font-size:14px;

}

h1{

margin-top:30px;

font-size:44px;

}

p{

margin-top:18px;

line-height:1.8;

font-size:18px;

color:#bdbdbd;

}

.loader{

margin:45px auto 0;

width:70px;
height:70px;

border:5px solid rgba(255,255,255,.08);

border-top:5px solid #39ff14;

border-radius:50%;

animation:spin 1s linear infinite;

}

small{

display:block;

margin-top:35px;

color:#777;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

@keyframes pulse{

50%{

transform:scale(1.15);

opacity:.25;

}

}

</style>

</head>

<body>

<div class="glow"></div>

<div class="card">

<div class="logo">
STEP <span>X</span>
</div>

<div class="tag">
⚡ WEBSITE UPGRADE
</div>

<h1>We're Improving Your Experience</h1>

<p>

Step X is currently undergoing maintenance to bring you
a faster, smoother and more premium shopping experience.

<br><br>

We'll be back very soon.

</p>

<div class="loader"></div>

<small>

© 2026 Step X • Thank you for your patience.

</small>

</div>

</body>

</html>
